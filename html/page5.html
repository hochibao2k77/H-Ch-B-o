<!DOCTYPE html>
<html lang="vi">
	<head>
		<title>Tính diện tích hình chữ nhật</title>
		<meta charset ="utf-8">
		<link rel = "stylesheet" href = "../css/page5.css">
	</head>
	<body> 
		<script>
			let d = prompt("Hãy nhập vào chiều dài của hình chữ nhật:  ");
			let r = Number(prompt("Hãy nhập vào rộng của hình chữ nhật: "));//Chuyển về trị số Number
			if(d<r)
				alert("Chiều dài phải nhỏ hơn chiều rộng");
			else if(d==r)
				alert("TRƯỜNG HỢP ĐẶC BIỆT:Diện tích hình vông là: " + d*r);
			else 
				alert("Diện tích hình chữ nhật là: " + d*r);
			
		</script>
	</body>
</html>
