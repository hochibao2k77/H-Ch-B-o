<!DOCTYPE html>
<html lang="vi">
<head> 
		<title> Thiết kế trang giới thiệu sản phẩm</title> 
		<meta charset = "utf-8">
		<link rel = "stylesheet" href = "../css/style04.css">
        <script src="../js/lib.js"></script>
</head>
<body>

    <div class="container">
        <div id="product-list">
        </div>
    </div>

<script >

//Xác định khung chứa product-list
const listProducts = document.getElementById("product-list");

//Tạo 1 container có class = "item"
const item = document.createElement("div");
item.setAttribute("class", "item");

//Tạo 2 khung chứa Hình ảnh và Thông tin
//Tạo 1 container chứa hình ảnh có class = "image" ==> chỉ có 1 con là img
const containerImage = document.createElement("div");
containerImage.setAttribute("class", "image");

//Tạo ảnh
const img = document.createElement("img");
img.setAttribute("src", "../assets/images/suzuki.jpg");
img.setAttribute("alt", "Hoa hồng Pháp");
img.setAttribute("style", "width:100%; max-width:150px");

//Đưa vào khung chứa ảnh
containerImage.appendChild(img);

//Tạo 1 container chứa thông tin sản phẩm có class = "info" ==> có 3 <p> và 1 <a>
const containerInfo = document.createElement("div");
containerInfo.setAttribute("class", "info");

//Tạo <p> chứa tên sản phẩm
const nameProduct = document.createElement("p");
nameProduct.innerHTML = "SUZUKI GFX 1000 ";

//Tạo <p> chứa giá sản phẩm
const price = document.createElement("p");
price.innerHTML = "415.000.000 VNĐ";

//Tạo <p> chứa mô tả sản phẩm
const description = document.createElement("p");
description.innerHTML =
    "Đây là một loại xe phân khối lớn bản cao cấp của nhà suzuki.Suzuki GSX-S1000 là mẫu naked-bike phân khối lớn nổi bật với sức mạnh từ khối động cơ 999cc và hệ thống phanh Brembo. Xe có trọng lượng ướt khoảng 209 kg, dung tích bình xăng 17 lít và mức tiêu hao nhiên liệu rơi vào khoảng 5,5 - 6,5 lít/100 km.Dưới đây là các thông số kỹ thuật chi tiết của dòng xe này:Động cơ: 4 thì, 4 xi-lanh thẳng hàng, DOHC, làm mát bằng dung dịch.Dung tích xi-lanh: 999cc.Công suất cực đại: ~143,5 - 150 mã lực (tùy thế hệ).Mô-men xoắn cực đại: ~106 Nm tại 9.500 vòng/phút.Hộp số: 6 cấp, côn tay, tích hợp bộ ly hợp hỗ trợ và trượt (Slipper Clutch).Kích thước tổng thể: 2.115 × 795 × 1.080 (mm).Chiều cao yên: 810 mm.Khoảng sáng gầm: 140 mm.Phanh trước: Đĩa đôi, cùm phanh Brembo cao cấp.Phanh sau: Đĩa đơn.";
    
//Tạo <a> chứa liên kết
const linkProduct = document.createElement("a");
linkProduct.innerHTML = "Xem chi tiết";
linkProduct.setAttribute("href", "page6.html");


//Gần 4 con vào khung chứng Info
containerInfo.appendChild(nameProduct);
containerInfo.appendChild(price);
containerInfo.appendChild(description);
containerInfo.appendChild(linkProduct);

//Thêm khung chứa image vào Info
item.appendChild(containerImage);
item.appendChild(containerInfo);

//Thêm item vào list product
listProducts.appendChild(item);

</script>

</body>
</html>
